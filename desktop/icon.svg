<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Glass Glow Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Emerald Indicator Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Liquid Dark Glass -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />
  
  <!-- Outer Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="url(#glassGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Ambient Light Spots Inside App Icon -->
  <circle cx="140" cy="140" r="100" fill="#7c3aed" opacity="0.25" filter="url(#glow)" />
  <circle cx="370" cy="370" r="110" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Inner Frosted Glass Console Panel -->
  <rect x="80" y="80" width="352" height="352" rx="48" fill="rgba(15, 23, 42, 0.65)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Terminal Top Bar Window Dots -->
  <circle cx="120" cy="120" r="10" fill="#ef4444" opacity="0.8" />
  <circle cx="150" cy="120" r="10" fill="#f59e0b" opacity="0.8" />
  <circle cx="180" cy="120" r="10" fill="#10b981" opacity="0.8" />

  <!-- Terminal Command Prompt Symbol ">" -->
  <path d="M140 180 L230 256 L140 332" fill="none" stroke="url(#cyanGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Terminal Underscore Cursor "_" -->
  <path d="M260 332 L360 332" fill="none" stroke="url(#glassGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)" />

  <!-- Active Status Neon Pulse Dot -->
  <circle cx="390" cy="120" r="12" fill="url(#emeraldGrad)" filter="url(#glow)" />
</svg>
