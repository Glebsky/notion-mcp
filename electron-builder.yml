appId: com.mcpterminal.desktop
productName: MCP Terminal
directories:
  output: release
files:
  - dist/**/*
  - dist-desktop/**/*
  - dist-renderer/**/*
  - desktop/icon.svg
  - desktop/icon.png
  - package.json
compression: normal
asar: true
asarUnpack:
  - "**/@ngrok/**"
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
  icon: desktop/icon.svg
  signExecutable: false
  signExts:
    - "!.exe"
portable:
  artifactName: "MCP Terminal Portable.exe"
  requestExecutionLevel: user
  unpackDirName: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MCP Terminal
